spring.application.name=backend

# PostgreSQL / Supabase Database
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-0-ap-south-1.pooler.supabase.com:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres.pxqebmwbizcoawthvfec}
